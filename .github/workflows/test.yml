name: Test

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions: {}

jobs:
  ut:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
    with:
      runner: ${{ matrix.runner }}
      task: ut

  integration:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest]

    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
    with:
      runner: ${{ matrix.runner }}
      task: integration

  integration-exe:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest]

    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
    with:
      runner: ${{ matrix.runner }}
      task: integration-exe

  e2e:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/reusable-test.yml
    permissions:
      contents: read
    with:
      runner: ${{ matrix.runner }}
      task: e2e
