name: Reusable Test

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      task:
        required: true
        type: string

permissions: {}

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Git config
        if: ${{ inputs.runner == 'windows-latest' }}
        shell: bash
        run: |
          git config --system core.longpaths true

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        # Manual runs leave the output unset; only 'false' skips later steps.
        if: github.event_name != 'workflow_dispatch'
        with:
          token: ''
          predicate-quantifier: 'some-with-excludes'
          filters: .github/filters.yml

      - name: Setup Node.js
        if: steps.changes.outputs.changed != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install pnpm
        if: steps.changes.outputs.changed != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: true

      - name: Build
        if: steps.changes.outputs.changed != 'false'
        run: pnpm run build

      - name: Unit Test
        if: steps.changes.outputs.changed != 'false' && inputs.task == 'ut'
        run: pnpm run test:unit

      - name: Integration Test (Rstest)
        if: steps.changes.outputs.changed != 'false' && inputs.task == 'integration'
        run: pnpm run test:integration

      - name: Integration Test For Executable (Rstest)
        if: steps.changes.outputs.changed != 'false' && inputs.task == 'integration-exe'
        run: pnpm run test:integration:exe

      - name: E2E Test (Playwright)
        if: steps.changes.outputs.changed != 'false' && inputs.task == 'e2e'
        run: pnpm run test:e2e
