catalogs:
  typescript-6:
    'typescript': '^6.0.3'
  typescript-6-fixed:
    'typescript': 'npm:@typescript/typescript6@^6.0.2'
    'typescript6-api': 'npm:@typescript/typescript6@^6.0.2'

allowBuilds:
  '@parcel/watcher': false
  core-js-pure: false
  esbuild: true
  svelte-preprocess: false

autoInstallPeers: false
dedupePeers: true
hoistPattern: []

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
  - reduce-configs
  - '@rstackjs/doc-ui'
  - '@rstackjs/create-toolkit'
  - 'rsbuild-plugin-*'
  - storybook-addon-rslib
  - 'storybook-*-rsbuild'
  - '@swc/*'
  - typescript
  - '@typescript/*'
  - heading-case

# Prevent un-reviewed build scripts
strictDepBuilds: true

strictPeerDependencies: false
