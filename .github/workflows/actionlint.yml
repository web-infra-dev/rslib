name: Actionlint

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash)
        shell: bash
      - name: Run actionlint
        run: |
          ./actionlint -color
        shell: bash
